<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="password-gen.css">
        <title>It's All Subjective</title>
        <link rel="icon" type="image/x-icon" href="images/web-icon-pw.png">
    </head>
    <body>
        <header>

        </header>
        <div class="center-pass-box">
            <div class="pass-container" id="pass-container">
                    <!-- Container -->
                <div class="password-gen-text" id="password-gen-text">
                    <!-- Title -->
                    <h1>Password Generator!</h1>
                </div>
                <div class="select-pass-chars" id="select-pass-chars">
                    <!-- CHECKBOXES FOR PASS CHARACTER -->
                    <input type="checkbox" id="lowercase" checked>
                    <label for="lowercase">Lowercase</label>
                    <input type="checkbox" id="uppercase" checked>
                    <label for="uppercase">Uppercase</label>
                    <input type="checkbox" id="symbols" checked>
                    <label for="symbols">Symbols</label>
                    <input type="checkbox" id="numbers" checked>
                    <label for="numbers">Numbers</label>
                    <input type="number" min="0" max="20" step="1" class="pass-length" id="pass-length" placeholder="Length (0-20)">
                </div>
                <div>
                    <button class="password-gen-btn" id="password-gen-btn">Generate Password</button>
                </div>
            </div>
            <div class="result-box" id="result-box">
                <span class="pass-result-span" id="pass-result-span">Password</span>
            </div>
        </div>
        <script src="password-gen.js"></script>    
    </body>
</html>
