<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>It's All Subjective</title>
        <link rel="icon" type="image/x-icon" href="images/web-icon-pw.png">

        <link rel="stylesheet" href="stopwatch.css">
    </head>
    <body>
        <header>

        </header>
        <div class="stopwatch-container" id="stopwatch-container">
            <h1 class="stopwatch-header">Stopwatch</h1>
            <div class="timer-count" id="timer-count">
                00:00:00:00
            </div>
            <div class="stopwatch-buttons" id="stopwatch-buttons">
                <button class="start-btn" id="start-btn" onclick="start()">Start</button>
                <button class="stop-btn" id="stop-btn" onclick="stop()">Stop</button>
                <button class="reset-btn" id="reset-btn" onclick="reset()">Reset</button>
            </div>
        </div>
        <script src="stopwatch.js"></script>
    </body>
</html>
